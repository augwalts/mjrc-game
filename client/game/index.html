<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MJRC — 香港麻雀</title>
<style>
:root{
  --felt:#12503f; --felt-dk:#0d3d30; --wood:#3a2a1e; --ink:#f2ece0; --dim:#a9b8ae;
  --tile:#f6f1e4; --tile-edge:#cdc3ab; --tile-ink:#22201c; --red:#b23b32; --green:#1f6b46;
  --gold:#d8b56a; --accent:#7fb3ff; --danger:#e08a6a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%, var(--felt) 0%, var(--felt-dk) 70%, #08251c 100%);
  color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;
  display:flex;flex-direction:column}

/* ── top bar ── */
#hud{display:flex;align-items:center;gap:14px;padding:6px 12px;font-size:12px;color:var(--dim);
  background:rgba(0,0,0,.22);backdrop-filter:blur(4px);flex:0 0 auto}
#hud b{color:var(--ink)}
#hud .spacer{flex:1}
#hud button{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid rgba(255,255,255,.16);
  border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
#hud button:hover{background:rgba(255,255,255,.16)}

/* ── table ── */
#table{flex:1;position:relative;min-height:0}
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:3px}
.seat.n{top:6px;left:50%;transform:translateX(-50%)}
.seat.e{right:8px;top:50%;transform:translateY(-50%);align-items:flex-end}
.seat.w{left:8px;top:50%;transform:translateY(-50%);align-items:flex-start}
.nameplate{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.32);border-radius:20px;
  padding:3px 10px;font-size:12px;white-space:nowrap}
.nameplate .wind{font-size:14px;color:var(--gold)}
.nameplate .chips{font-variant-numeric:tabular-nums}
.nameplate.turn{outline:2px solid var(--gold);box-shadow:0 0 14px rgba(216,181,106,.45)}
.nameplate .dealer{background:var(--red);color:#fff;border-radius:4px;padding:0 4px;font-size:10px}
.avatar{width:22px;height:22px;border-radius:50%;background:linear-gradient(160deg,#5b7a6a,#2c4438);
  display:flex;align-items:center;justify-content:center;font-size:12px}
.backrow{display:flex;gap:1px}
.back{width:12px;height:17px;border-radius:2px;background:linear-gradient(180deg,#2f7a5f,#1d5c46);
  border:1px solid #14493a}
.seat.e .backrow,.seat.w .backrow{flex-direction:column}
.seat.e .back,.seat.w .back{width:17px;height:12px}
.meldrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:230px}

/* ── centre: the pile ── */
#centre{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(52vw,430px);height:min(34vh,250px);display:flex;flex-direction:column;align-items:center;justify-content:center}
#wallinfo{font-size:11px;color:var(--dim);margin-bottom:4px;letter-spacing:.04em}
#wallinfo b{color:var(--ink);font-variant-numeric:tabular-nums}
#pile{position:relative;width:100%;height:100%}
#pile .tile{position:absolute;transition:transform .28s cubic-bezier(.2,.9,.3,1.2),opacity .2s}
#pile .tile.fresh{animation:toss .34s cubic-bezier(.2,.9,.3,1.2)}
@keyframes toss{from{transform:translateY(-46px) scale(1.28) rotate(0deg);opacity:.2}}
#pile .tile.hot{outline:2px solid var(--gold);box-shadow:0 0 12px rgba(216,181,106,.6);z-index:9}

/* ── tiles ── */
.tile{width:30px;height:41px;border-radius:4px;background:linear-gradient(178deg,#fffdf7,var(--tile) 55%,#e7dfcc);
  border:1px solid var(--tile-edge);box-shadow:0 1px 0 #b8ad93,0 2px 4px rgba(0,0,0,.3);
  color:var(--tile-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:600;user-select:none;line-height:1}
.tile .g{font-size:20px}
.tile .n{font-size:9px;opacity:.55;margin-top:1px}
.tile.sm{width:21px;height:29px}.tile.sm .g{font-size:14px}.tile.sm .n{display:none}
.tile.man{color:var(--red)} .tile.sou{color:var(--green)} .tile.pin{color:#2b5b8c}
.tile.hon{color:#2a2a2a} .tile.flower{background:linear-gradient(178deg,#fff6f8,#f4e2e6);color:#a3436a}

/* ── your area ── */
#mine{flex:0 0 auto;padding:4px 10px 10px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.3) 40%)}
#mymelds{display:flex;gap:8px;justify-content:center;min-height:30px;margin-bottom:2px}
#myhand{display:flex;gap:4px;justify-content:center;align-items:flex-end;min-height:62px;flex-wrap:wrap}
#myhand .tile{width:40px;height:55px;cursor:pointer;transition:transform .12s,box-shadow .12s}
#myhand .tile .g{font-size:27px}
#myhand .tile:hover{transform:translateY(-9px);box-shadow:0 6px 14px rgba(0,0,0,.45)}
#myhand .tile.drawn{margin-left:16px;animation:pop .28s ease-out}
@keyframes pop{from{transform:translateY(-22px) scale(.8);opacity:.4}}
#myhand.locked .tile{cursor:default}#myhand.locked .tile:hover{transform:none;box-shadow:0 1px 0 #b8ad93,0 2px 4px rgba(0,0,0,.3)}
#actions{display:flex;gap:8px;justify-content:center;align-items:center;min-height:42px;margin-top:5px}
#actions button{background:rgba(255,255,255,.1);color:var(--ink);border:1px solid rgba(255,255,255,.22);
  border-radius:9px;padding:9px 18px;font-size:15px;font-weight:600;cursor:pointer}
#actions button:hover{background:rgba(255,255,255,.2)}
#actions button.win{background:var(--gold);color:#2a2113;border-color:var(--gold)}
#actions button.pass{font-weight:400;opacity:.8}
#actions .hint{color:var(--dim);font-size:13px}

/* ── overlays ── */
.veil{position:fixed;inset:0;background:rgba(4,12,9,.82);display:flex;align-items:center;justify-content:center;
  z-index:40;padding:16px}
.panel{background:linear-gradient(180deg,#1b3a30,#12281f);border:1px solid rgba(216,181,106,.35);
  border-radius:14px;padding:22px 26px;max-width:640px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel h1{font-size:20px;margin:0 0 4px}
.panel h2{font-size:16px;margin:0 0 10px;color:var(--gold)}
.panel p{color:var(--dim);font-size:13px;margin:6px 0}
.panel .tiles{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:12px 0}
.awards{font-size:13px;color:var(--dim);margin:8px 0}
.awards b{color:var(--ink)}
.pay{display:flex;gap:14px;justify-content:center;font-size:14px;margin:12px 0;flex-wrap:wrap}
.pay div{background:rgba(0,0,0,.25);border-radius:8px;padding:6px 12px}
.pay .d{font-variant-numeric:tabular-nums;font-weight:700}
.pay .up{color:#7fd6a0}.pay .down{color:var(--danger)}
.panel button{background:var(--gold);color:#2a2113;border:0;border-radius:9px;padding:11px 22px;
  font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0}
.choice{background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.14);border-radius:10px;padding:12px;
  cursor:pointer;text-align:left}
.choice:hover{border-color:var(--gold)}
.choice.sel{border-color:var(--gold);background:rgba(216,181,106,.14)}
.choice b{display:block;font-size:14px;margin-bottom:3px}
.choice span{color:var(--dim);font-size:11.5px;line-height:1.35;display:block}
#log{position:absolute;left:8px;bottom:8px;font-size:11px;color:rgba(255,255,255,.5);max-width:210px;
  pointer-events:none;line-height:1.5}
@media (max-width:820px){
  #myhand .tile{width:32px;height:44px}#myhand .tile .g{font-size:21px}
  .tile{width:24px;height:33px}.tile .g{font-size:16px}
  #centre{width:60vw}
  #log{display:none}
}
</style>
</head>
<body>
<div id="hud">
  <span>round <b id="hudRound">東</b></span>
  <span>hand <b id="hudHand">1</b></span>
  <span>wall <b id="hudWall">—</b></span>
  <span class="spacer"></span>
  <span id="hudTable"></span>
  <button id="btnQuit">quit</button>
</div>
<div id="table">
  <div class="seat n" id="seatN"></div>
  <div class="seat w" id="seatW"></div>
  <div class="seat e" id="seatE"></div>
  <div id="centre"><div id="wallinfo"></div><div id="pile"></div></div>
  <div id="log"></div>
</div>
<div id="mine">
  <div id="mymelds"></div>
  <div id="myhand"></div>
  <div id="actions"></div>
</div>
<div class="veil" id="veil"><div class="panel" id="panel"></div></div>
<script>
for (const f of ["bots.js", "game.js"]) {
  const t = document.createElement("script");
  t.src = f + "?v=" + Date.now();
  t.async = false;
  document.head.appendChild(t);
}
</script>
</body>
</html>
