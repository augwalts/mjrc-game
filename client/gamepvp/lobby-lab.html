<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lobby lab</title>
<style>
  :root{--bg:#0f0e0c;--panel:#17201b;--panel2:#1e2a24;--line:rgba(255,255,255,.1);--ink:#f2ece0;--dim:#a9b8ae;--gold:#d8b56a;--green:#7fe0a4;--red:#ff9b93;--blue:#7fb3ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:12px;padding:14px}
  h1{font-size:16px;margin:0}
  #controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  #controls button{font:inherit;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer}
  #controls button.on{background:var(--gold);color:#1a1409;border-color:transparent;font-weight:600}
  .note{color:var(--dim);max-width:760px;text-align:center;margin:0}
  /* the device frame */
  #frames{display:flex;gap:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap;width:100%}
  .frame{position:relative;background:#000;border-radius:28px;padding:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .frame .label{position:absolute;top:-22px;left:12px;font-size:12px;color:var(--dim)}
  .frame.phone{width:395px;margin-top:26px}
  .frame.desktop{width:min(96vw,1100px);margin-top:26px}
  .screen{background:var(--bg);border-radius:20px;overflow:hidden;position:relative}
  .frame.phone .screen{height:780px}
  .frame.desktop .screen{height:720px}
  .app{height:100%;display:flex;flex-direction:column}
  .view{flex:1;overflow:auto;padding:14px 14px 90px}
  .frame.desktop .view{padding:20px 28px}
  /* shared bits */
  .top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .top h2{font-size:18px;margin:0}
  .top .me,.nav .me{margin-left:auto;display:flex;flex-direction:row;align-items:center;gap:8px;color:var(--dim);white-space:nowrap}
  .recent .row{white-space:nowrap;overflow:hidden}
  .recent .row .badge{flex:0 0 auto}
  .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(160deg,#5b7a6a,#2c4438);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--ink)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block}
  .dot.wait{background:var(--gold)} .dot.play{background:var(--blue)} .dot.room{background:#c9a3ff}
  .sec{font-size:11px;letter-spacing:.12em;color:var(--gold);text-transform:uppercase;margin:16px 0 8px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .cta{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .cta button{font:inherit;padding:16px 12px;border-radius:14px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);text-align:left;cursor:pointer}
  .cta button b{display:block;font-size:16px;margin-bottom:2px}
  .cta button.primary{background:var(--gold);color:#1a1409;border-color:transparent}
  .cta button small{color:inherit;opacity:.75}
  .chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
  .chip{flex:0 0 auto;display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:6px 10px 6px 6px;white-space:nowrap}
  .chip small{color:var(--dim)}
  .table{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
  .table .head{display:flex;align-items:center;gap:8px}
  .table .head b{font-size:15px}
  .badge{font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:6px;padding:2px 6px;color:var(--dim)}
  .badge.ranked{color:var(--gold);border-color:rgba(216,181,106,.5)}
  .table .rules{margin-left:auto;color:var(--dim);font-size:12px}
  .seats{display:flex;gap:6px}
  .seat{flex:1;border:1px dashed var(--line);border-radius:8px;padding:6px;text-align:center;font-size:12px;color:var(--dim)}
  .seat.h{border-style:solid;color:var(--ink);background:rgba(255,255,255,.04)} .seat.b{border-style:solid;color:var(--dim);background:rgba(127,179,255,.08)}
  .row{display:flex;align-items:center;gap:8px}
  .row .sit{margin-left:auto;font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;border:0;background:var(--gold);color:#1a1409;cursor:pointer}
  .recent{display:flex;flex-direction:column;gap:6px;color:var(--dim);font-size:13px}
  .recent b{color:var(--ink)}
  .up{color:var(--green)} .down{color:var(--red)}
  /* bottom nav (variant B/C) */
  .nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
  .nav button{flex:1;font:inherit;font-size:11px;background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  .nav button span.i{display:block;height:22px}
  .stats .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
  .stats .tiles b{display:block;font-size:18px}
  .stats .tiles small{color:var(--dim);font-size:11px}
  .stats .streak{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);color:var(--dim);font-size:12px}
  .stats .streak .flame{color:var(--gold);display:flex}
  .stats .streak b{color:var(--ink);font-size:13px}
  .nav button.on{color:var(--gold)}
  /* tabs (variant A) */
  .tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
  .tabs button{font:inherit;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:none;color:var(--dim);white-space:nowrap}
  .tabs button.on{background:var(--gold);color:#1a1409;border-color:transparent;font-weight:600}
  /* desktop columns */
  .frame.desktop .cols{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}
  .frame.desktop .nav{position:static;background:none;border:0;justify-content:flex-start;gap:12px;padding:0 0 12px}
  .frame.desktop .nav button{flex:0 0 auto;flex-direction:row;font-size:13px}
  .frame.desktop .nav .me.innav{margin-left:auto}
  .me .inbox{position:relative;background:none;border:0;color:var(--dim);padding:0;margin:0 4px 0 0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;line-height:0;vertical-align:middle}
  .me .inbox svg{display:block}
  .me .inbox .n{position:absolute;top:-3px;right:-5px;background:var(--gold);color:#1a1409;font-size:10px;font-weight:700;border-radius:8px;padding:0 4px;line-height:14px;min-width:14px;text-align:center}
  .me .dot{margin-left:2px}
  .more{display:block;margin-top:8px;color:var(--gold);font-size:12px;text-decoration:none}
  .rooms .room{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
  .rooms .room:last-child{border:0}
  .rooms .room b{font-size:15px}
  .rooms .room small{color:var(--dim);display:block}
  .rooms .room .n{margin-left:auto;color:var(--dim);font-size:12px;text-align:right}
</style>
</head>
<body>
<h1>Lobby lab</h1>
<p class="note">Three layouts of the same data. The question to answer on opening the page: who is here, where can I sit, and what is the one thing to press. Switch variants and frames; nothing here is wired to the server.</p>
<div id="controls">
  <button data-v="D" class="on">D · home: play now, friends, your numbers</button>
  <button data-v="B">B · play first</button>
  <button data-v="C">C · rooms first</button>
  <button data-v="A">A · tabs (today)</button>
</div>
<div id="frames">
  <div class="frame phone"><div class="label">mobile · 375 × 780</div><div class="screen"><div class="app"></div></div></div>
  <div class="frame desktop"><div class="label">web · 1100 × 720</div><div class="screen"><div class="app"></div></div></div>
</div>

<script>
(() => {
  const data = {
    me: "Augustine",
    here: [
      { n: "augie", s: "wait", t: "waiting 2/4" }, { n: "jolly", s: "play", t: "hand 3/4" }, { n: "augwalts", s: "play", t: "hand 3/4" },
      { n: "Mei", s: "lobby", t: "in the lobby" }, { n: "Kelvin", s: "lobby", t: "in the lobby" }, { n: "Sam", s: "wait", t: "waiting 2/4" },
    ],
    tables: [
      { by: "augie", mode: "casual", rules: "MJRC standard · 東圈 · normal", seats: [["augie","h"],["Sam","h"],["","e"],["","e"]], status: "waiting", filled: "2/4" },
      { by: "jolly", mode: "ranked", rules: "MJRC standard · 全莊 · faster", seats: [["jolly","h"],["augwalts","h"],["Mei","h"],["Ken","h"]], status: "playing", filled: "hand 3/16" },
      { by: "Kelvin", mode: "casual", rules: "TVB 2026 · 東圈 · untimed", seats: [["Kelvin","h"],["Sifu","b"],["Ming","b"],["","e"]], status: "waiting", filled: "3/4" },
    ],
    recent: [["9/2","augie",+96,"jolly",-32],["9/2","Augustine",+288,"Sam",-128],["9/1","Mei",+64,"Kelvin",-64]],
    friends: [
      { n: "augie", s: "wait", t: "waiting at a table 2/4", r: 1540 }, { n: "jolly", s: "play", t: "playing, hand 3/4", r: 1498 }, { n: "augwalts", s: "room", t: "in Tuesday club", r: 1611 },
      { n: "Mei", s: "lobby", t: "in the lobby", r: 1470 }, { n: "Sam", s: "off", t: "2 h ago", r: 1452 }, { n: "Kelvin", s: "off", t: "yesterday", r: null },
    ],
    stats: { rating: 1512, games: 23, wins: 7, places: [7, 6, 5, 5], agreement: 0.61, streak: { days: 4, best: 9, playedToday: true } },
    mine: [["today","2nd","+96","MJRC standard · 東圈","ranked"],["today","4th","−128","TVB 2026 · 東圈","casual"],["9/1","1st","+288","MJRC standard · 東圈","ranked"],["8/31","3rd","−32","MJRC standard · 全莊","casual"]],
    rooms: [
      { name: "Tuesday club", code: "K8SV9K", rules: "MJRC standard · 東圈 · normal", n: 11, live: 2 },
      { name: "TVB practice", code: "5SF724", rules: "TVB 2026 · 全莊 · very slow", n: 6, live: 0 },
    ],
  };
  const I = {
    home: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
    tables: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 12h18M12 5v14"/></svg>',
    rooms: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V6l8-3 8 3v14"/><path d="M9 20v-5h6v5"/></svg>',
    friends: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M15.5 20a5 5 0 0 1 6-4.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
    stats: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>',
    inbox: '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
    flame: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-6 1-9z"/></svg>',
    me: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  };
  const navHtml = (on, items) => `<div class="nav">${items.map(([k, label]) => `<button class="${k === on ? "on" : ""}"><span class="i">${I[k]}</span>${label}</button>`).join("")}</div>`;
  const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const dot = (s) => `<span class="dot ${s === "wait" ? "wait" : s === "play" ? "play" : ""}"></span>`;
  const seatsHtml = (t) => `<div class="seats">${t.seats.map(([n, k]) => `<div class="seat ${k}">${n ? esc(n) : "empty"}</div>`).join("")}</div>`;
  const tableHtml = (t) => `<div class="card table">
      <div class="head"><b>${esc(t.by)}</b><span class="badge ${t.mode}">${t.mode}</span><span class="rules">${t.rules}</span></div>
      ${seatsHtml(t)}
      <div class="row"><span style="color:var(--dim)">${t.status === "waiting" ? t.filled + " seated" : "playing · " + t.filled}</span>${t.status === "waiting" ? '<button class="sit">Sit down</button>' : ""}</div>
    </div>`;
  const hereChips = () => `<div class="chips">${data.here.map((p) => `<div class="chip"><span class="avatar">${esc(p.n[0])}</span>${esc(p.n)}<small>${dot(p.s)} ${p.t}</small></div>`).join("")}</div>`;
  const recentHtml = () => `<div class="card recent">${data.recent.map((r) => `<div>${r[0]} · <b>${esc(r[1])}</b> <span class="up">+${r[2]}</span> · ${esc(r[3])} <span class="down">${r[4]}</span></div>`).join("")}</div>`;
  const roomsHtml = () => `<div class="card rooms">${data.rooms.map((r) => `<div class="row room"><span class="avatar">${esc(r.name[0])}</span><div><b>${esc(r.name)}</b><small>${r.rules} · code ${r.code}</small></div><div class="n">${r.n} members<br>${r.live ? r.live + " tables live" : "quiet"}</div></div>`).join("")}</div>`;
  const meHtml = () => `<div class="me"><button class="inbox" title="messages">${I.inbox}<span class="n">2</span></button><span class="dot"></span>${esc(data.me)}</div>`;
  const top = () => `<div class="top"><h2>香港麻雀 · MJRC</h2>${meHtml()}</div>`;
  const cta = (primaryLabel = "Play now") => `<div class="cta"><button class="primary"><b>${primaryLabel}</b><small>pick rules, speed and seats</small></button><button><b>Join by code</b><small>or open an invite link</small></button></div>`;

  const friendsHtml = (n = 5) => `<div class="card friends">${data.friends.slice(0, n).map((f) => `<div class="row" style="padding:5px 0"><span class="avatar">${esc(f.n[0])}</span><b>${esc(f.n)}</b><span style="color:var(--dim)">${f.s === "off" ? "" : dot(f.s)} ${f.t}</span><span style="margin-left:auto;color:var(--dim);font-size:12px">${f.r === null ? "unrated" : f.r}</span></div>`).join("")}<a class="more" href="#">all ${data.friends.length} friends ›</a></div>`;
  const statsHtml = () => { const st = data.stats; return `<div class="card stats"><div class="tiles">
      <div><b>${st.rating}</b><small>rating · provisional</small></div>
      <div><b>${st.wins}/${st.games}</b><small>wins</small></div>
      <div><b>${Math.round(st.agreement * 100)}%</b><small>like the engine</small></div>
      <div><b>${st.places.join("·")}</b><small>1st·2nd·3rd·4th</small></div></div>
      <div class="streak"><span class="flame">${I.flame}</span><b>${st.streak.days}-day streak</b><span>${st.streak.playedToday ? "played today" : "play today to keep it"} · best ${st.streak.best}</span></div></div>`; };
  const mineHtml = (n = 3) => `<div class="card recent">${data.mine.slice(0, n).map((r) => `<div class="row">${r[0]} · <b>${r[1]}</b> <span class="${r[2].startsWith("+") ? "up" : "down"}">${r[2]}</span> · ${r[3]}<span class="badge ${r[4]}" style="margin-left:auto">${r[4]}</span></div>`).join("")}<a class="more" href="#">all games ›</a></div>`;
  const variants = {
    D: () => `${top()}
      ${cta()}
      <div class="sec">Friends</div>${friendsHtml()}
      <div class="sec">Your numbers</div>${statsHtml()}
      <div class="sec">Your recent games</div>${mineHtml()}
      ${navHtml("home", [["home","Home"],["tables","Tables"],["rooms","Rooms"],["friends","Friends"],["me","Me"]])}`,
    A: () => `${top()}
      <div class="tabs"><button class="on">Play</button><button>Chat</button><button>Stats</button><button>Games</button><button>Rooms</button></div>
      <div class="sec">Here now</div><div class="card">${data.here.map((p) => `<div class="row" style="padding:4px 0">${dot(p.s)} ${esc(p.n)}<span style="margin-left:auto;color:var(--dim)">${p.t}</span></div>`).join("")}</div>
      <div class="sec">Open tables</div>${data.tables.map(tableHtml).join("")}
      <div class="sec">New table · Join by code</div>${cta()}
      <div class="sec">Recent results</div>${recentHtml()}`,
    B: () => `${top()}
      ${cta()}
      <div class="sec">Here now · ${data.here.length}</div>${hereChips()}
      <div class="sec">Tables</div>${data.tables.map(tableHtml).join("")}
      <div class="sec">Recent</div>${recentHtml()}
      ${navHtml("home", [["home","Play"],["rooms","Rooms"],["chat","Chat"],["stats","Stats"],["me","Me"]])}`,
    C: () => `${top()}
      <div class="sec">Your rooms</div>${roomsHtml()}
      <div class="sec">Everyone</div>${cta("Open table")}
      <div class="sec">Here now · ${data.here.length}</div>${hereChips()}
      <div class="sec">Tables</div>${data.tables.slice(0, 2).map(tableHtml).join("")}
      ${navHtml("rooms", [["home","Play"],["rooms","Rooms"],["chat","Chat"],["stats","Stats"],["me","Me"]])}`,
  };
  const desktopWrap = (html) => {
    // On desktop the same content becomes two columns: tables left, people + recent right.
    return html;
  };
  let v = "D";
  function renderInto(app, desktop) {
    app.innerHTML = `<div class="view">${variants[v]()}</div>`;
    if (desktop) {
      const view = app.querySelector(".view");
      const nav = view.querySelector(".nav"); const me = view.querySelector(".top .me");
      if (nav) { if (me) { me.classList.add("innav"); nav.appendChild(me); } view.prepend(nav); }
      const left = document.createElement("div"), right = document.createElement("div"), cols = document.createElement("div"); cols.className = "cols";
      const nodes = [...view.childNodes].filter((n) => !(n.classList && (n.classList.contains("top") || n.classList.contains("nav") || n.classList.contains("tabs"))));
      let side = left;
      for (const n of nodes) {
        if (n.classList && n.classList.contains("sec")) side = /Here now|Recent|Your rooms|Friends/.test(n.textContent) ? right : left;
        if (n.classList && n.classList.contains("cta")) side = left;
        side.appendChild(n);
      }
      cols.append(left, right); view.appendChild(cols);
    }
  }
  function render() {
    document.querySelectorAll(".frame").forEach((fr) => renderInto(fr.querySelector(".app"), fr.classList.contains("desktop")));
  }
  document.querySelectorAll("#controls [data-v]").forEach((b) => b.onclick = () => { v = b.dataset.v; document.querySelectorAll("[data-v]").forEach((x) => x.classList.toggle("on", x === b)); render(); });
  render();
})();
</script>
</body>
</html>
