<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MJRC self-play panel</title>
<style>
:root{--bg:#1c1c22;--card:#26262e;--line:#3a3a44;--ink:#e6e6ec;--dim:#9a9aa6;
  --ok:#5dbb7a;--warn:#e08a6a;--acc:#7fb3ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:20px;max-width:1440px;margin:0 auto}
h1{font-size:16px;margin:0 0 2px}
.sub{color:var(--dim);font-size:11.5px;margin-bottom:16px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:12px}
.kpis .card h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:start;margin-bottom:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.scrollcard{max-height:420px;overflow-y:auto}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:13px}
.card h2{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);
  margin:0 0 9px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
th{text-align:right;color:var(--dim);font-weight:600;font-size:10px;text-transform:uppercase;
  letter-spacing:.05em;padding:3px 6px;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
td{text-align:right;padding:4px 6px;border-bottom:1px solid #2e2e36}
.up{color:var(--ok)} .down{color:var(--warn)} .mut{color:var(--dim)}
.spark{width:100%;height:64px;display:block}
.big{font-size:22px;font-weight:700}
.pill{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;
  background:#33333d;color:var(--dim);margin-left:8px}
.pill.live{background:#1e3a2a;color:var(--ok)}
.kv{display:flex;justify-content:space-between;padding:2px 0;font-size:12px}
.matchlist{max-height:440px;overflow-y:auto}
details.match{border-bottom:1px solid #2e2e36}
details.match summary{cursor:pointer;padding:5px 4px;font-size:12px;
  font-variant-numeric:tabular-nums;list-style-position:inside}
details.match summary:hover{background:#2c2c35}
.tiles{font-size:13px;letter-spacing:.04em}
.wtile{color:var(--acc);font-weight:700;border-bottom:1px solid var(--acc)}
</style>
</head>
<body>
<h1>Self-play weight evolution <span class="pill" id="status"></span></h1>
<div class="sub" id="sub">waiting for data.js…</div>
<div id="overnightbar"></div>
<div class="kpis" id="kpis"></div>
<div class="cols">
  <div class="col" id="colL"></div>
  <div class="col" id="colR"></div>
</div>
<div id="wide"></div>
<script src="overnight.js"></script>
<script src="data.js"></script>
<script>
const D = window.SIM_DATA;
// ── overnight series strip (present only while/after a series runs) ──
{
  const O = window.OVERNIGHT;
  const el = document.getElementById("overnightbar");
  if (O && el) {
    const hoursLeft = Math.max(0, (O.deadline - O.now) / 3600e3).toFixed(1);
    const done = O.cycles.filter((c) => c.heldOutChips !== null);
    const best = O.hofScore === null || O.hofScore === -Infinity ? "—" : O.hofScore;
    const line = done.map((c) => {
      const v = c.heldOutChips;
      const cls = c.improved ? "up" : "mut";
      return `<span class="${cls}" title="cycle ${c.cycle} · ${c.opponent} · ${c.matches}m">${v > 0 ? "+" : ""}${v}</span>`;
    }).join(" → ");
    el.innerHTML = `<div class="card" style="margin-bottom:12px;display:flex;gap:18px;align-items:baseline;flex-wrap:wrap">
      <b>Overnight series</b>
      <span class="mut">${O.statusLine} · ${hoursLeft}h remaining</span>
      <span>hall of fame vs baseline: <b class="${typeof best === "number" && best > 0 ? "up" : ""}">${typeof best === "number" && best > 0 ? "+" : ""}${best}</b> chips/match</span>
      ${line ? `<span class="mut" style="font-size:11px">held-out by cycle: ${line}</span>` : ""}
      <span class="mut" style="font-size:11px">(the cards below are the LIVE cycle, updating per generation)</span>
    </div>`;
  }
}
// The optimizer rewrites data.js after every generation; reload to pick it up.
if (!D || D.status === "running" || (D.history ?? []).length === 0) {
  setTimeout(() => location.reload(), 45_000);
}
if (!D) { document.getElementById("sub").textContent = "no data.js yet — run evolve.mjs first"; }
else if (D.history.length === 0) {
  document.getElementById("status").textContent = D.status;
  document.getElementById("status").className = "pill live";
  document.getElementById("sub").textContent =
    "run started " + D.updated + " — generation 0 takes a few minutes; this page reloads itself every 45s";
} else {
  const H = D.history;
  const last = H[H.length - 1];
  const promoted = H.filter(g => g.promoted !== null).length;
  const totalMatches = H.length * (1 + 6) * 24;
  document.getElementById("status").textContent = D.status;
  document.getElementById("status").className = "pill" + (D.status === "running" ? " live" : "");
  document.getElementById("sub").textContent =
    `${H.length} generations · ${promoted} promotions · ~${totalMatches.toLocaleString()} matches simulated · updated ${D.updated} — refresh for latest`;

  const spark = (vals, {lo, hi, fmt = v => v, color = "var(--acc)"} = {}) => {
    if (!vals.length) return "";
    lo = lo ?? Math.min(...vals); hi = hi ?? Math.max(...vals);
    if (hi === lo) { hi = lo + 1; }
    const W = 300, Hh = 60, pad = 4;
    const x = i => pad + i / Math.max(1, vals.length - 1) * (W - 2 * pad);
    const y = v => Hh - pad - (v - lo) / (hi - lo) * (Hh - 2 * pad);
    const pts = vals.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
    return `<svg class="spark" viewBox="0 0 ${W} ${Hh}" preserveAspectRatio="none">
      <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6"/>
      ${vals.map((v, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="1.8" fill="${color}"/>`).join("")}
    </svg><div class="kv"><span class="mut">start ${fmt(vals[0])}</span><b>now ${fmt(vals[vals.length-1])}</b></div>`;
  };

  const bestChips = H.map(g => Math.max(...g.candidates.map(c => c.result.chipsPerMatch)));
  const hasPts = last.candidates[0].result.pointsPerMatch !== undefined;
  const bestPts = H.map(g => Math.max(...g.candidates.map(c => c.result.pointsPerMatch ?? 0)));
  const texture = k => H.map(g => {
    const src = g.promoted !== null ? g.candidates.find(c => c.id === g.promoted) : null;
    return (src ? src.result : g.control)[k];
  });

  const PATTERN_LABELS = {
    selfDraw:"self-draw 自摸", allChows:"All Chows 平糊", allPungs:"All Pungs 對對糊",
    halfFlush:"Half Flush 混一色", fullFlush:"Full Flush 清一色", dragonPung:"dragon pung 三元牌",
    seatWind:"seat wind 門風", roundWind:"round wind 圈風", ownFlower:"own flower 正花",
    ownSeason:"own season 正花(季)", noFlowers:"no bonus tiles 無花", concealedHand:"concealed 門前清",
    winOnKongReplacement:"kong replacement 槓上開花", winOnLastTile:"last tile 海底撈月",
    winOnLastDiscard:"last discard 河底撈魚", mixedTerminals:"mixed terminals 混么九",
    smallThreeDragons:"Small 3 Dragons 小三元", bigThreeDragons:"Big 3 Dragons 大三元",
    allTerminals:"All Terminals 清么九", allHonours:"All Honours 字一色",
    fourConcealedPungs:"4 Concealed Pungs 四暗刻", nineGates:"Nine Gates 九蓮寶燈",
    thirteenOrphans:"13 Orphans 十三么", heavenlyHand:"Heavenly 天糊", earthlyHand:"Earthly 地糊",
    allKongs:"All Kongs 十八羅漢", bigFourWinds:"Big 4 Winds 大四喜", smallFourWinds:"Small 4 Winds 小四喜",
    robbingKong:"robbing the kong 搶槓", winByDoubleKong:"double kong win 槓上槓",
    allFlowers:"all 4 flowers 齊四花", allSeasons:"all 4 seasons 齊四季",
  };
  const cards = [];
  const put = (slot, html) => cards.push({ slot, html });
  // ── THE number: incumbent vs the frozen season-start bot, fixed seeds ──
  const benches = H.map((g) => g.bench).filter(Boolean);
  if (benches.length) {
    const b = benches[benches.length - 1];
    const line = benches.map((x) => x.chipsPerMatch);
    put("kpis", `<div class="card"><h2>vs frozen baseline — chips/match</h2>
      <div class="big ${b.chipsPerMatch > 0 ? "up" : b.chipsPerMatch < 0 ? "down" : ""}">${b.chipsPerMatch > 0 ? "+" : ""}${b.chipsPerMatch}</div>
      ${spark(line, { fmt: (v) => (v > 0 ? "+" : "") + v, color: b.chipsPerMatch >= 0 ? "var(--ok)" : "var(--warn)" })}
      <div class="mut" style="font-size:11px">won <b class="up">${b.chipsWonPerMatch}</b> · lost <b class="down">${b.chipsLostPerMatch}</b> per match.
      ${b.dealInLossPerMatch !== undefined ? `The loss, attributed: <b class="down">${b.dealInLossPerMatch}</b> from deal-ins
      (${b.dealInsPerMatch}/match — YOUR discard fed the win) + <b>${b.taxLossPerMatch}</b> self-draw tax (dodgeable only by winning first).` : ""}
      Same frozen opponent and walls every generation.</div></div>`);
  }
  // ── what the bots actually DO: latest generation's activity mix ──
  const actSrc = (g) => {
    const c = g.promoted !== null ? g.candidates.find(x => x.id === g.promoted) : null;
    return (c ? c.result : g.control).activity;
  };
  const act = actSrc(last);
  if (act) {
    const per = (n) => (n / act.hands).toFixed(2);
    const winsTotal = act.winsOnDiscard + act.selfDraws;
    const pats = Object.entries(act.patterns).sort((a, b) => b[1] - a[1]).slice(0, 12);
    put('colR', `<div class="card"><h2>What the bots are actually doing — latest generation</h2>
      <div class="mut" style="font-size:11px;margin-bottom:5px">All rates are <b>average count per hand played</b> —
      "0.53 chows" means a typical hand contains about half a chow claim across the whole table (four seats).</div>
      <table>
        <tr><td>chows 上</td><td>${per(act.chows)} / hand</td></tr>
        <tr><td>pungs 碰</td><td>${per(act.pungs)} / hand</td></tr>
        <tr><td>kongs 槓 (all forms)</td><td>${per(act.kongs)} / hand</td></tr>
        <tr><td>wins — on a discard 食糊</td><td>${per(act.winsOnDiscard)} / hand</td></tr>
        <tr><td>wins — self-draw 自摸</td><td>${per(act.selfDraws)} / hand</td></tr>
      </table>
      ${(() => {
        const claims = act.chows + act.pungs + act.kongs;
        if (!claims) return "";
        const pc = (n) => (n / claims * 100).toFixed(0) + "%";
        return `<div class="mut" style="font-size:11px;margin-top:4px">of all claims: ${pc(act.chows)} chow · ${pc(act.pungs)} pung · ${pc(act.kongs)} kong</div>`;
      })()}
      ${(() => {
        const h = act.faanHist;
        if (!h || !h.some((n) => n > 0)) return "";
        const max = Math.max(...h);
        const wins = h.reduce((a, b) => a + b, 0);
        return `<div class="mut" style="font-size:11px;margin:10px 0 3px"><b>Winning-hand size distribution</b> — ${wins} wins by final faan:</div>
          <div style="display:flex;align-items:flex-end;gap:3px;height:52px">` +
          h.map((n, f) => f < 3 ? "" :
            `<div style="flex:1;text-align:center"><div style="background:var(--acc);height:${(n / max * 40).toFixed(0)}px;border-radius:2px 2px 0 0"></div><div style="font-size:9px;color:var(--dim)">${f}</div><div style="font-size:9px">${n || ""}</div></div>`).join("") +
          `</div><div class="mut" style="font-size:10px;margin-top:2px">a wall at 3 = everyone scrapes the floor; mass at 5+ = value hands actually happen</div>`;
      })()}
      <div class="mut" style="font-size:11px;margin:8px 0 4px"><b>Winning-pattern census</b> — every scoring
      pattern that appeared in a winning hand across this generation's ~${act.hands.toLocaleString()} hands
      (${winsTotal} wins). This answers "which routes actually pay":</div>
      <table>${pats.map(([id, n]) => `<tr><td>${PATTERN_LABELS[id] ?? id}</td>
        <td>${n}</td><td class="mut">${(n / Math.max(1, winsTotal) * 100).toFixed(0)}% of wins</td></tr>`).join("")}</table>
      <div class="mut" style="font-size:11px;margin-top:6px">Older runs recorded no activity — this card starts
      with the first run after 2026-08-27.</div></div>`);
  }
  if (hasPts) {
    put('kpis', `<div class="card"><h2>Best challenger — points/match</h2>
      <div class="big">${bestPts[bestPts.length-1] > 0 ? "+" : ""}${bestPts[bestPts.length-1]}</div>
      ${spark(bestPts, {fmt: v => (v>0?"+":"")+v})}
      <div class="mut" style="font-size:11px">1st +3 · 2nd +1 · 3rd −1 · 4th −3, averaged. The selection fitness since run 3 —
      bounded, so the promote bar (0.5) sits above the noise floor (±0.43 at 48 matches). Promotion additionally
      requires CONFIRMING on a fresh unseen seed set. Expect few promotions; that is the design working.</div></div>`);
  }
  put('colR', `<div class="card"><h2>Best challenger — chips/match (recorded only)</h2>
    <div class="big">${bestChips[bestChips.length-1] > 0 ? "+" : ""}${bestChips[bestChips.length-1]}</div>
    ${spark(bestChips, {fmt: v => (v>0?"+":"")+v})}
    <div class="mut" style="font-size:11px">Recorded, no longer the selection metric: one limit hand swings ±100 chips and drowns the signal.</div></div>`);

  put('kpis', `<div class="card"><h2>Refused wins / hand</h2>
    <div class="big">${texture("refusedPerHand").slice(-1)[0]}</div>
    ${spark(texture("refusedPerHand"), {lo: 0, color: "var(--warn)", fmt: v => v})}
    <div class="mut" style="font-size:11px">Times per hand a bot completed a winning shape it legally could not take
 (under the 3-faan floor) — the single most rage-inducing texture flaw for a human. Steered mainly by the
 belowMinimumPenalty dial below; both runs so far raised that dial on their own.</div></div>`);

  put('kpis', `<div class="card"><h2>Draw rate 流局</h2>
    <div class="big">${(texture("drawRate").slice(-1)[0]*100).toFixed(0)}%</div>
    ${spark(texture("drawRate"), {lo: 0, hi: 0.7, fmt: v => (v*100).toFixed(0)+"%"})}
    <div class="mut" style="font-size:11px">流局 — the wall ran out and NOBODY won (not self-draw — 自摸 is a win).
 Prototype baseline was 69%; real tables feel like 10–20%. Most draws here are authentic: someone was ready, the tile never came.</div></div>`);

  put('kpis', `<div class="card"><h2>Mean winning faan</h2>
    <div class="big">${texture("meanFaan").slice(-1)[0]}</div>
    ${spark(texture("meanFaan"), {fmt: v => v})}
    <div class="mut" style="font-size:11px">Average faan of winning hands. 3.0 = everyone scrapes the minimum; rising = hands
 built for value. The owner's principle says neither extreme survives — this shows where the mix settles.</div></div>`);

  const WEIGHT_DOCS = {
    faanWeight: "Value vs speed: how much a route's payout matters over finishing fast. Low = race for any legal 3 faan; high = build big hands.",
    routeDistanceWeight: "The sprint dial: penalty per tile the chosen route still needs. High = pick nearly-done routes.",
    offRouteWeight: "Rebuild cost: penalty per dealt tile the route would throw away. Low = happy to dump a suit and rebuild.",
    belowMinimumPenalty: "The anti-sin: charge on any route that cannot legally reach 3 faan. This is the refused-wins dial.",
    discardDistanceWeight: "Stay close to ready: penalty for a cut that moves the hand further from winning. The dominant discard term.",
    discardRouteWeight: "Commitment: prefer cuts that serve the chosen route. High = tunnel vision, low = stay flexible.",
    discardSafetyWeight: "Defence: prefer cutting tiles with more copies already visible on the table.",
    discardOutsWeight: "Tiny tiebreak between equal cuts by how many live winning tiles each keeps. Deliberately small.",
    claimSpeedGain: "Minimum speed-up a pung/chow must buy before the bot will take it.",
    claimRouteTolerance: "Claim discipline: how much route value a claim may destroy before it is refused. Claiming always costs concealment.",
    aggression: "Global claim eagerness multiplier. The personality dial — and the noisiest one in every run so far.",
    chipValuation: "0 = value routes by LINEAR faan (the old bug); 1 = by expected CHIPS through the ruleset's payment table. 6 faan pays ~8× a 3-faan hand, not 2×.",
    routeDecay: "P(route completes) per remaining tile of distance — disciplines the exponential payout so slow-huge doesn't always beat fast-small.",
    leftFeedWeight: "The seat before you is your supply line: their discard mix raises or sinks each suit route (owner's route-picking read).",
  };
  const K = D.keys;
  const w0 = D.defaults, wN = last.incumbentAfter;
  put('colR', `<div class="card scrollcard"><h2>Incumbent weights — hand-guessed → evolved</h2>
    <div class="mut" style="font-size:11px;margin-bottom:8px">The bot's entire personality is these 11 dials — coefficients of its three
    decision formulas (route choice · discard choice · claim choice). Evolution never invents behaviour, it only re-balances them.
    "default" is the hand-guessed starting value; green/red Δ = evolution raised/lowered it.</div>
    <table><tr><th>weight</th><th>default</th><th>now</th><th>Δ</th></tr>
    ${K.map(k => {
      const d = wN[k] / w0[k] - 1;
      const cls = Math.abs(d) < 0.05 ? "mut" : d > 0 ? "up" : "down";
      return `<tr><td>${k}<div class="mut" style="font-size:10.5px;line-height:1.35;max-width:300px;white-space:normal">${WEIGHT_DOCS[k] ?? ""}</div></td><td class="mut">${w0[k]}</td><td><b>${wN[k]}</b></td>
        <td class="${cls}">${d > 0 ? "+" : ""}${(d*100).toFixed(0)}%</td></tr>`;
    }).join("")}</table></div>`);

  // ── the matches themselves: latest generation's control set, hand by hand ──
  // Tile id 0-41 → characters, mirroring TILE_NAMES in engine/src/tiles.ts.
  const TILE_CHARS = (() => {
    const n = [];
    for (let i = 1; i <= 9; i++) n.push(i + "萬");
    for (let i = 1; i <= 9; i++) n.push(i + "索");
    for (let i = 1; i <= 9; i++) n.push(i + "筒");
    n.push("東","南","西","北","中","發","白");
    n.push("梅","蘭","菊","竹","春","夏","秋","冬");
    return n;
  })();
  const tileStr = t => TILE_CHARS[t] ?? ("?" + t);
  const OUTCOME_LABELS = {
    winOnDiscard: "win 食糊", selfDraw: "self-draw 自摸", exhaustiveDraw: "exhaustive draw 流局",
  };
  if (Array.isArray(D.sampleMatches) && D.sampleMatches.length > 0) {
    const handHtml = (hand) => {
      if (!hand) return '<span class="mut">—</span>';
      const concealed = [...(hand.concealed ?? [])].sort((a, b) => a - b).map(tileStr).join(" ");
      const melds = (hand.melds ?? []).map(m => "[" + m.tiles.map(tileStr).join("") + "]").join(" ");
      const win = `<span class="wtile" title="winning tile">${tileStr(hand.winningTile)}</span>`;
      const awards = (hand.awards ?? [])
        .map(a => `${PATTERN_LABELS[a.id] ?? a.id} <b>${a.faan}</b>`).join(" · ");
      return `<span class="tiles">${[concealed, melds, win].filter(Boolean).join(" ")}</span>` +
        (awards ? `<div class="mut" style="font-size:10.5px">${awards}</div>` : "");
    };
    const matchHtml = (m) => {
      const top = Math.max(...m.chips);
      const chipsLine = m.chips
        .map((c, s) => { const t = `S${s} ${c > 0 ? "+" : ""}${c}`; return c === top ? `<b>${t}</b>` : t; })
        .join(" · ");
      const rows = (m.handRecords ?? []).map((h, i) =>
        `<tr><td class="mut">${i}</td><td>${OUTCOME_LABELS[h.outcome] ?? h.outcome}</td>
         <td>${h.winner === null ? '<span class="mut">—</span>' : "S" + h.winner}</td>
         <td>${h.faan ?? '<span class="mut">—</span>'}</td>
         <td style="text-align:left;white-space:normal">${handHtml(h.winningHand)}</td></tr>`).join("");
      return `<details class="match"><summary>seed ${m.seed} · ${m.hands} hands · ${chipsLine}</summary>
        <table><tr><th>#</th><th>outcome</th><th>winner</th><th>faan</th><th style="text-align:left">winning hand</th></tr>
        ${rows}</table></details>`;
    };
    put('wide', `<div class="card"><h2>Matches — latest generation control set</h2>
      <div class="mut" style="font-size:11px;margin-bottom:8px">The incumbent playing itself on the control seeds —
      ${D.sampleMatches.length} full matches. Click a match to see every hand: who won, the faan, and the winning
      hand face up (melds bracketed, winning tile highlighted). Seats are S0–S3; the top chip take is bold.</div>
      <div class="matchlist">${D.sampleMatches.map(matchHtml).join("")}</div></div>`);
  }

  // ── narrative: what actually changed, generation by generation ──
  {
    const BAR = 0.5;
    const pts = (v) => (v > 0 ? "+" : "") + (v ?? 0);
    const entries = H.map((g, i) => {
      const best = [...g.candidates].sort((a, b) => (b.result.pointsPerMatch ?? 0) - (a.result.pointsPerMatch ?? 0))[0];
      const bestPts = best?.result.pointsPerMatch ?? 0;
      const ctrl = g.control.pointsPerMatch ?? 0;
      if (g.promoted === null) {
        let why;
        if (g.confirm) why = `challenger #${best.id} won its seed set (${pts(bestPts)}pt vs control ${pts(ctrl)}) but FAILED the fresh-seed confirm (${pts(g.confirm.pointsPerMatch)}pt &lt; bar ${BAR}) — rejected as luck`;
        else if (bestPts > ctrl) why = `best challenger ${pts(bestPts)}pt vs control ${pts(ctrl)} — under the ${BAR} bar, not worth the risk`;
        else why = `no challenger beat the incumbent (best ${pts(bestPts)}pt vs control ${pts(ctrl)})`;
        return `<div style="padding:6px 0;border-bottom:1px solid #2e2e36">
          <b>gen ${g.gen}</b> · <span class="mut">kept the incumbent</span>
          <div class="mut" style="font-size:11px">${why}</div></div>`;
      }
      // promoted: weight diffs vs previous incumbent + texture old→new on identical walls
      const prev = i > 0 ? H[i - 1].incumbentAfter : D.defaults;
      const now = g.incumbentAfter;
      const moves = D.keys
        .map((k) => ({ k, from: prev[k], to: now[k], d: prev[k] ? now[k] / prev[k] - 1 : 0 }))
        .filter((m) => Math.abs(m.d) > 0.05)
        .sort((a, b) => Math.abs(b.d) - Math.abs(a.d))
        .slice(0, 5)
        .map((m) => `${m.k} ${m.from}→<b>${m.to}</b> (${m.d > 0 ? "+" : ""}${(m.d * 100).toFixed(0)}%)`)
        .join(" · ");
      const nw = g.candidates.find((c) => c.id === g.promoted).result;
      const tex = [];
      const dd = (a, b, label, fmt) => { if (a !== undefined && b !== undefined && a !== b) tex.push(`${label} ${fmt(a)}→${fmt(b)}`); };
      dd(g.control.refusedPerHand, nw.refusedPerHand, "refused/hand", (v) => v);
      dd(g.control.drawRate, nw.drawRate, "draws", (v) => (v * 100).toFixed(0) + "%");
      dd(g.control.claimsPerHand, nw.claimsPerHand, "claims/hand", (v) => v);
      dd(g.control.meanFaan, nw.meanFaan, "faan", (v) => v);
      return `<div style="padding:6px 0;border-bottom:1px solid #2e2e36">
        <b>gen ${g.gen}</b> · <span class="up">PROMOTED #${g.promoted}</span>
        <span class="mut">(${pts(bestPts)}pt, confirmed ${pts(g.confirm?.pointsPerMatch)})</span>
        <div style="font-size:11px;margin-top:2px">${moves || "only sub-5% nudges"}</div>
        ${tex.length ? `<div class="mut" style="font-size:11px">same-wall texture, old→new incumbent: ${tex.join(" · ")}</div>` : ""}</div>`;
    });
    // overall drift since the run began
    const start = D.defaults, end = last.incumbentAfter;
    const drift = D.keys
      .map((k) => ({ k, d: start[k] ? end[k] / start[k] - 1 : 0 }))
      .filter((m) => Math.abs(m.d) > 0.10)
      .sort((a, b) => Math.abs(b.d) - Math.abs(a.d))
      .map((m) => `${m.k} ${m.d > 0 ? "+" : ""}${(m.d * 100).toFixed(0)}%`)
      .join(" · ");
    put('colL', `<div class="card scrollcard"><h2>What changed, generation by generation</h2>
      <div class="mut" style="font-size:11px;margin-bottom:6px">A promotion is a weight-set replacing the champion after winning twice
      (its seed set AND a fresh confirm). "Kept" generations are the noise gate working, not stagnation.
      ${drift ? `<br><b>Net drift this run vs the hand-tuned start:</b> ${drift}` : "<br><b>No net weight drift yet this run.</b>"}</div>
      ${[...entries].reverse().join("")}</div>`);
  }

  put('colL', `<div class="card scrollcard"><h2>Generation log</h2>
    <div class="mut" style="font-size:11px;margin-bottom:8px"><b>control</b> = the incumbent playing itself on the same seeds — its
    distance from 0 IS the noise floor. <b>best</b> = top challenger of 6 on seed set A. <b>confirm</b> = that challenger re-tested
    on a fresh unseen set B (— means it never cleared set A). Promotion needs BOTH to clear the bar, so most generations keep the
    incumbent — that is the design working, not failing.</div>
    <table><tr><th>gen</th><th>control</th><th>best</th><th>confirm</th><th>promoted</th><th>vs base</th><th>matches</th><th>hands</th><th>secs</th></tr>
    ${[...H].reverse().map(g => {
      const b = Math.max(...g.candidates.map(c => c.result.chipsPerMatch));
      const src = g.promoted !== null ? g.candidates.find(c => c.id === g.promoted).result : g.control;
      const pts = v => v === undefined ? "—" : (v > 0 ? "+" : "") + v;
      const bp = g.candidates[0].result.pointsPerMatch !== undefined
        ? Math.max(...g.candidates.map(c => c.result.pointsPerMatch)) : undefined;
      return `<tr><td>${g.gen}</td><td class="mut">${pts(g.control.pointsPerMatch ?? g.control.chipsPerMatch)}</td>
        <td>${pts(bp ?? b)}</td>
        <td class="mut">${g.confirm ? pts(g.confirm.pointsPerMatch) : "—"}</td>
        <td>${g.promoted === null ? '<span class="mut">—</span>' : '<span class="up">#'+g.promoted+"</span>"}</td>
        <td>${g.bench ? (g.bench.chipsPerMatch>0?"+":"")+g.bench.chipsPerMatch : "—"}</td>
        <td class="mut">${g.work ? g.work.matches : "~336"}</td>
        <td class="mut">${g.work ? g.work.hands.toLocaleString() : "~2,400"}</td>
        <td class="mut">${(g.ms/1000).toFixed(0)}</td></tr>`;
    }).join("")}</table></div>`);

  for (const slot of ["kpis", "colL", "colR", "wide"]) {
    const el = document.getElementById(slot === "kpis" ? "kpis" : slot === "wide" ? "wide" : slot);
    el.innerHTML = cards.filter((c) => c.slot === slot).map((c) => c.html).join("");
  }
}
</script>
</body>
</html>
